<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Briefing — Seu site</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f4f6fb;--card:#fff;--line:#e3e8f0;--txt:#16203a;--mute:#64748b;--p:#4f46e5;--p2:#7c3aed;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--r:14px}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt);line-height:1.55;font-size:16px}
.casca{max-width:760px;margin:0 auto;padding:22px 16px 60px}
.topo{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:16px}
.topo i{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;display:grid;place-items:center;font-style:normal;font-weight:800;flex:0 0 auto}
.topo b{display:block;font-size:1.02rem}
.topo span{font-size:.82rem;color:var(--mute)}
.barra{margin:0 4px 18px}
.trilho{background:var(--line);border-radius:99px;height:8px;overflow:hidden}
.preenche{background:linear-gradient(90deg,var(--p),var(--p2));height:100%;width:0;border-radius:99px;transition:width .4s}
.leg{display:flex;justify-content:space-between;font-size:.8rem;color:var(--mute);margin-top:6px}
.cartao{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px 22px;display:grid;gap:22px;box-shadow:0 4px 18px rgba(30,41,59,.05)}
.cartao h1{font-size:1.35rem;letter-spacing:-.3px}
.cartao .desc{color:var(--mute);font-size:.92rem;margin-top:-16px}
.q{display:grid;gap:8px}
.q label{font-weight:700;font-size:.95rem}
.q .ajuda{font-size:.82rem;color:var(--mute);font-weight:400}
input,textarea{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:11px;font:inherit;font-size:.98rem;background:#fafbfe;transition:.15s}
input:focus,textarea:focus{outline:0;border-color:var(--p);background:#fff;box-shadow:0 0 0 4px rgba(79,70,229,.1)}
.opcoes{display:grid;gap:10px}
.opcao{display:flex;gap:13px;align-items:flex-start;border:1.5px solid var(--line);border-radius:11px;padding:14px;cursor:pointer;transition:.15s;background:#fafbfe}
.opcao:hover{border-color:var(--p)}
.opcao.on{border-color:var(--p);background:#eef2ff;box-shadow:0 0 0 3px rgba(79,70,229,.08)}
.opcao input{width:auto;margin-top:3px;accent-color:var(--p)}
.opcao b{display:block;font-size:.95rem}
.opcao small{color:var(--mute);font-size:.82rem}
.seg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.seg{border:1.5px solid var(--line);border-radius:11px;padding:13px 8px;text-align:center;cursor:pointer;background:#fafbfe;font-size:.88rem;font-weight:600;transition:.15s}
.seg:hover{border-color:var(--p)}
.seg.on{border-color:var(--p);background:#eef2ff}
.seg em{display:block;font-style:normal;font-size:1.5rem;margin-bottom:4px}
.cor-grid{display:flex;flex-wrap:wrap;gap:10px}
.cor{width:46px;height:46px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:.15s}
.cor.on{border-color:var(--txt);transform:scale(1.12)}
/* lista de serviços */
.lista{display:grid;gap:12px}
.item{display:grid;gap:8px;border:1.5px solid var(--line);border-radius:11px;padding:13px;background:#fafbfe}
.item .lin{display:flex;gap:8px;align-items:center}
.item .lin input:first-child{flex:1}
.item .preco{width:110px;flex:0 0 auto}
/* fotos */
.fotos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.foto{position:relative;border-radius:11px;overflow:hidden;border:2px solid transparent}
.foto.on{border-color:var(--p)}
.foto img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.foto .capa{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.65);color:#fff;font-size:.68rem;font-weight:800;padding:3px 9px;border-radius:99px}
.foto button{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);color:#fff;border:0;width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:.9rem}
.up{border:2px dashed var(--line);border-radius:11px;padding:22px;text-align:center;cursor:pointer;background:#fafbfe;color:var(--mute);font-size:.9rem;transition:.15s}
.up:hover{border-color:var(--p);color:var(--p)}
.up b{display:block;color:var(--txt);margin-bottom:2px}
.banco-note{font-size:.82rem;color:var(--mute)}
.botoes{display:flex;gap:12px;flex-wrap:wrap}
.bt{flex:1;min-width:150px;border:0;border-radius:11px;padding:15px 20px;font:inherit;font-weight:700;font-size:1rem;cursor:pointer;transition:.18s;min-height:50px}
.bt.pri{background:linear-gradient(90deg,var(--p),var(--p2));color:#fff;box-shadow:0 6px 18px rgba(79,70,229,.3)}
.bt.pri:hover{transform:translateY(-2px)}
.bt.pri:disabled{opacity:.6;transform:none}
.bt.sec{background:#fff;border:1.5px solid var(--line);color:var(--txt)}
.bt.sec:hover{border-color:var(--p)}
/* final: preview + ajustes */
.final{display:grid;grid-template-columns:1fr;gap:18px}
.preview{position:sticky;top:12px;align-self:start}
.preview iframe{width:100%;height:560px;border:1px solid var(--line);border-radius:var(--r);background:#fff;box-shadow:0 8px 30px rgba(30,41,59,.12)}
.ajustes{display:grid;gap:14px;align-content:start}
.aj{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px}
.aj b{display:block;font-size:.9rem;margin-bottom:10px}
.aj .mini{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);border-radius:99px;padding:7px 14px;font-size:.85rem;cursor:pointer;background:#fafbfe;font-weight:600}
.chip.on{border-color:var(--p);background:#eef2ff}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1.5px solid var(--line);border-radius:11px;padding:12px 14px;cursor:pointer;font-size:.9rem;font-weight:600}
.tog .sw{width:44px;height:26px;border-radius:99px;background:#cbd5e1;position:relative;transition:.2s;flex:0 0 auto}
.tog .sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 5px rgba(0,0,0,.25)}
.tog.on .sw{background:var(--p)}
.tog.on .sw::after{left:21px}
.fim{text-align:center;padding:38px 22px}
.selo{width:64px;height:64px;border-radius:50%;background:#dcfce7;color:var(--ok);display:grid;place-items:center;font-size:1.9rem;margin:0 auto 16px;font-weight:800}
.fim h2{font-size:1.4rem;margin-bottom:10px}
.fim p{color:var(--mute);margin-bottom:18px}
.link{background:#eef2ff;border:1px solid #c7d2fe;border-radius:11px;padding:14px;font-family:ui-monospace,monospace;font-size:.9rem;word-break:break-all;margin-bottom:16px;text-align:left}
.molde{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:16px;box-shadow:0 8px 30px rgba(30,41,59,.1)}
.cbeco{background:#f1f5f9;border-bottom:1px solid var(--line);padding:8px 12px;display:flex;align-items:center;gap:6px}
.cbeco s{width:9px;height:9px;border-radius:50%;background:#e2e8f0;display:block}
.cbeco em{flex:1;background:#fff;border-radius:99px;padding:4px 12px;font-style:normal;font-size:.78rem;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.molde iframe{width:100%;height:420px;border:0;background:#fff}
.extras{margin-top:14px}
.extras details{border:1px solid var(--line);border-radius:var(--r);background:#fff;margin-bottom:10px;overflow:hidden}
.extras summary{padding:15px 18px;font-weight:700;cursor:pointer;list-style:none;font-size:.92rem}
.extras summary::after{content:'+';float:right;color:var(--p);font-weight:800}
.extras details[open] summary::after{content:'–'}
.extras .corpo{padding:0 18px 18px;display:grid;gap:16px}
.aviso{background:#fffbeb;border:1px solid #fde68a;border-radius:11px;padding:12px 14px;font-size:.85rem;color:#92400e}
@media(min-width:900px){
 .final{grid-template-columns:1.15fr .85fr}
 .preview iframe{height:640px}
}
</style>
</head>

  function horariosSchema(hs) {
    const MAPA = {
      'segunda':'Monday','terça':'Tuesday','terca':'Tuesday','quarta':'Wednesday','quinta':'Thursday',
      'sexta':'Friday','sábado':'Saturday','sabado':'Saturday','domingo':'Sunday',
    };
    const out = [];
    for (const h of (hs || [])) {
      if (!h || !h.dia || !h.hora) continue;
      const m = String(h.hora).match(/(\d{1,2})[:h](\d{2})?\s*[-–às]+\s*(\d{1,2})[:h](\d{2})?/i);
      if (!m) continue;
      const abre = `${m[1].padStart(2,'0')}:${m[2] || '00'}`;
      const fecha = `${m[3].padStart(2,'0')}:${m[4] || '00'}`;
      const dia = String(h.dia).toLowerCase();
      const dias = [];
      if (dia.includes('a sex') || dia.includes('a sext')) dias.push('Monday','Tuesday','Wednesday','Thursday','Friday');
      else for (const [k, v] of Object.entries(MAPA)) if (dia.includes(k)) dias.push(v);
      if (dias.length) out.push({ '@type':'OpeningHoursSpecification', dayOfWeek:[...new Set(dias)], opens:abre, closes:fecha });
    }
    return out;
  }

  function gerar(cfg) {
    const c = cfg || {};
    const nome = (c.nome || 'Minha Empresa').trim();
    const pal = c.paletaCustom ? c.paletaCustom : (PALETAS[c.paleta] || PALETAS.esmeralda);
    const fnt = FONTES[c.fonte] || FONTES.moderna;
    const est = ESTILOS[c.estilo] || ESTILOS.moderno;
    const sec = c.secoes || {};
    const dark = !!c.escuro && c.escuro !== '0';
    const ramo = RAMOS[c.perfil] || RAMO_PADRAO;

    /* ── variação determinística: dois clientes do mesmo ramo nunca ficam iguais ── */
    const variante = Number.isInteger(c.variante) ? c.variante : hash(nome + '|' + (c.perfil || '')) % 3;

    /* ── contato / WhatsApp com mensagem por seção ── */
    const tel = soDigitos(c.whatsapp);
    const waNum = tel ? (tel.length <= 11 ? '55' + tel : tel) : '';
    const msgs = c.msgs || {};
    const msgPadrao = msgs.geral || `Olá! Vim pelo site da ${nome} e gostaria de mais informações.`;
    const msgDe = (tipo, extra) => {
      const base = msgs[tipo];
      if (base) return extra ? base + ' ' + extra : base;
      return msgPadrao;
    };
    const waLink = (extra) => waNum ? `https://wa.me/${waNum}?text=${encodeURIComponent(extra || msgPadrao)}` : '';

    /* ── serviços (aceita campo categoria para cardápios agrupados) ── */
    const servicos = (c.servicos || []).filter(s => s && s.titulo);
    const mostrarPrecos = c.mostrarPrecos !== false && c.mostrarPrecos !== 'nao' && c.mostrarPrecos !== 'false';
    const grupos = [];
    for (const s of servicos) {
      const g = (s.categoria || '').trim();
      let item = grupos.find(x => x.nome === g);
      if (!item) { item = { nome: g, itens: [] }; grupos.push(item); }
      item.itens.push(s);
    }

    const depos = (c.depoimentos || []).filter(d => d && d.texto);      // só reais, nunca inventados
    const numeros = (c.numeros || []).filter(n => n && n.valor);
    const faq = (c.faq || []).filter(f => f && f.p && f.r);
    const equipe = (c.equipe || []).filter(e => e && e.nome);
    const horarios = (c.horarios || []).filter(h => h && h.dia);
    const difs = linhas(c.diferenciais);
    const convenios = linhas(c.convenios).slice(0, 10);

    /* ── fotos: até 6, leves ── */
    let fotos = (Array.isArray(c.fotos) ? c.fotos : [])
      .map(f => typeof f === 'string' ? { url: f } : f)
      .filter(f => f && f.url)
      .slice(0, 6);
    /* compat legado do construtor */
    if (!fotos.length && c.heroImagem) fotos.unshift({ url: c.heroImagem, alt: 'Ambiente da ' + nome });
    if (c.sobreImagem && !fotos.some(f => f.url === c.sobreImagem)) fotos.push({ url: c.sobreImagem, alt: 'Interior da ' + nome });
    for (const g of linhas(c.galeria)) if (fotos.length < 6) fotos.push({ url: g });
    /* banco ilustrativo do ramo quando o cliente não mandou nenhuma foto */
    let usaBanco = false;
    if (!fotos.length && BANCO[c.perfil]) { usaBanco = true; fotos.push({ url: BANCO[c.perfil], alt: nome, credito: 'imagem ilustrativa' }); }
    const capa = fotos[0] || null;
    const galeria = fotos.slice(1, 6);

    /* ── prova social REAL: nunca inventar números ── */
    const nota = String(c.notaMedia || '').replace(/[^\d.,]/g, '').trim();
    const qtd = String(c.qtdAvaliacoes || '').replace(/\D/g, '');
    const anos = String(c.anosAtendimento || c.anos || '').replace(/\D/g, '');
    const bairro = String(c.bairro || '').trim();
    const prova = {
      nota: nota || '', qtd: qtd || '', anos: anos || '', bairro: bairro || '',
      link: c.linkAvaliacoes || c.linkGoogle || '',
    };
    const temProva = !!(prova.nota || prova.anos || prova.bairro);

    /* ── hero: 3 tipos ── */
    let heroTipo = c.heroTipo;
    if (!heroTipo || heroTipo === 'auto') {
      if (capa && variante === 1) heroTipo = 'split';
      else if (capa) heroTipo = 'foto';
      else heroTipo = 'faixa';
    }
    if (heroTipo === 'foto' && !capa) heroTipo = 'faixa';
    if (heroTipo === 'split' && !capa) heroTipo = 'faixa';

    const dark2 = dark ? '#0b0f14' : '#ffffff';
    const bg2 = dark ? '#111820' : pal.l;
    const txt = dark ? '#e8eef4' : '#1a2230';
    const mute = dark ? '#9aa8b6' : '#5b6774';
    const line = dark ? '#1e2833' : '#e6e9ee';
    const card = dark ? '#141c25' : '#ffffff';

    const nav = [];
    if (sec.sobre) nav.push(['#sobre', 'Sobre']);
    if (servicos.length) nav.push(['#servicos', c.rotuloServicos || ramo.rotulo]);
    if (galeria.length) nav.push(['#galeria', 'Fotos']);
    if (equipe.length) nav.push(['#equipe', 'Equipe']);
    if (depos.length || nota) nav.push(['#avaliacoes', 'Avaliações']);
    if (faq.length) nav.push(['#faq', 'Dúvidas']);
    if (horarios.length) nav.push(['#horario', 'Horário']);
    nav.push(['#contato', 'Contato']);

    const iniciais = nome.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase() || 'ME';
    const descricao = (c.descricao || c.slogan || c.sobreTexto || `${nome} — atendimento de qualidade.`)
      .toString().split('\n')[0].slice(0, 158);
    const marca = c.logo
      ? `<img src="${attr(c.logo)}" alt="Logo ${attr(nome)}" class="logoimg">`
      : `<i aria-hidden="true">${esc(iniciais)}</i>`;

    const schema = {
      '@context':'https://schema.org', '@type': c.tipoNegocio || ramo.tipo,
      name: nome, description: descricao,
      ...(c.logo && /^https?:/.test(c.logo) ? { logo: c.logo, image: c.logo } : {}),
      ...(c.telefone || c.whatsapp ? { telephone: c.telefone || c.whatsapp } : {}),
      ...(c.email ? { email: c.email } : {}),
      ...(c.endereco ? { address: { '@type':'PostalAddress', streetAddress: c.endereco } } : {}),
      ...(c.precoFaixa ? { priceRange: c.precoFaixa } : {}),
      ...(horariosSchema(horarios).length ? { openingHoursSpecification: horariosSchema(horarios) } : {}),
      ...(nota ? { aggregateRating: { '@type':'AggregateRating', ratingValue: nota.replace(',', '.'), reviewCount: qtd || '5' } } : {}),
      ...(c.instagram || c.facebook ? { sameAs: [
        c.instagram ? (String(c.instagram).startsWith('http') ? c.instagram : 'https://instagram.com/' + String(c.instagram).replace('@','')) : null,
        c.facebook ? (String(c.facebook).startsWith('http') ? c.facebook : 'https://facebook.com/' + c.facebook) : null,
      ].filter(Boolean) } : {}),
    };

    const anim = c.animacoes !== false;
    const rv = anim ? ' data-rv' : '';
    const textoCta = c.textoCta || ramo.cta || 'Chamar no WhatsApp';

    /* ============ CSS (mobile-first) ============ */
    const CSS = `
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

.agenda .grade b{font-weight:700}
.agenda .grade span{color:var(--mute);font-weight:600;font-variant-numeric:tabular-nums}
.agenda .hj{display:inline-flex;align-items:center;gap:6px;background:${pal.p}1a;color:var(--p);padding:4px 12px;border-radius:99px;font-size:.78rem;font-weight:750;margin-left:8px;white-space:nowrap}

/* convênios (clínica) */
.convs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:6px}
.conv{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:10px 20px;font-size:.92rem;font-weight:650;box-shadow:var(--sh)}

/* quartos (hotel) */
.quartos{display:grid;grid-template-columns:1fr;gap:20px}
.quarto{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column}
.quarto img{width:100%;aspect-ratio:16/10;object-fit:cover}
.quarto .qd{padding:20px;display:flex;flex-direction:column;gap:8px;flex:1}
.quarto h3{font-size:1.12rem}
.quarto p{color:var(--mute);font-size:.92rem;flex:1}
.quarto .pr{font-family:${fnt.h};font-weight:800;color:var(--p);font-size:1.25rem}

/* planos (academia) */
.planos{display:grid;grid-template-columns:1fr;gap:20px}
.plano{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:10px}
.plano.rec{background:linear-gradient(160deg,${pal.p}10,var(--card) 55%);border-color:${pal.p}66}
.plano h3{font-size:1.1rem}
.plano .pr{font-family:${fnt.h};font-weight:800;font-size:1.7rem;color:var(--p)}
.plano .pr small{font-size:.85rem;color:var(--mute);font-weight:600}
.plano ul{list-style:none;display:grid;gap:8px;margin:6px 0;flex:1}
.plano li{display:flex;gap:9px;align-items:flex-start;font-size:.93rem}
.plano svg{color:var(--p);width:18px;height:18px;margin-top:2px}

/* áreas de atuação */
.areas{display:grid;grid-template-columns:1fr;gap:12px}
.area{display:flex;gap:13px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh)}
.area svg{color:var(--p);width:22px;height:22px;margin-top:2px}
.area b{display:block;font-size:1rem}
.area span{color:var(--mute);font-size:.9rem}

/* cards de serviços (padrão) */
.grid{display:grid;grid-template-columns:1fr;gap:18px}
.card{background:var(--card);padding:26px;border-radius:var(--r);box-shadow:var(--sh);border:${est.border==='none'?'1px solid var(--line)':est.border};display:flex;flex-direction:column;gap:8px}
.card h3{font-size:1.12rem}
.card p{color:var(--mute);font-size:.94rem;flex:1}
.card .preco{font-family:${fnt.h};font-weight:800;color:var(--p);font-size:1.25rem;border-top:1px dashed var(--line);padding-top:12px;margin-top:6px}
.ico{width:48px;height:48px;border-radius:${est.radius==='4px'?'9px':est.radius};background:linear-gradient(135deg,var(--p),var(--a));color:#fff;display:grid;place-items:center;font-size:1.3rem;margin-bottom:6px}

/* galeria */
.gal{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gal figure{position:relative;overflow:hidden;border-radius:var(--r);box-shadow:var(--sh);aspect-ratio:1}
.gal img{width:100%;height:100%;object-fit:cover}
.gal figcaption{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;font-size:.74rem;padding:18px 10px 8px;opacity:0;transition:opacity .25s}
.gal figure:hover figcaption{opacity:1}

/* depoimentos — só reais */
.dep{background:var(--card);padding:26px;border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--line);display:flex;flex-direction:column}
.estrelas{display:flex;gap:3px;color:#f59e0b;font-size:1rem;margin-bottom:12px}
.dep p{font-style:italic;margin-bottom:18px;font-size:1rem;flex:1}
.quem{display:flex;align-items:center;gap:12px}
.quem .av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--a));color:#fff;display:grid;place-items:center;font-weight:800}
.quem strong{display:block;font-size:.95rem}
.quem span{font-size:.83rem;color:var(--mute)}
/* faixa do Google (nota real, sem depoimentos) */
.gfaixa{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:24px;max-width:640px;margin:0 auto;text-align:center}
.gfaixa .n{font-family:${fnt.h};font-size:2.6rem;font-weight:800;color:#f59e0b;line-height:1}
.gfaixa .star{color:#f59e0b;font-size:1.1rem;display:flex;gap:2px}
.gfaixa p{color:var(--mute);font-size:.92rem}

/* faq */
.faq{max-width:760px;margin:0 auto;display:grid;gap:12px}
.faq details{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.faq summary{padding:18px 20px;font-weight:700;cursor:pointer;list-style:none;display:flex;align-items:center;gap:14px;font-size:1rem}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:'';margin-left:auto;width:10px;height:10px;border-right:2.5px solid var(--p);border-bottom:2.5px solid var(--p);transform:rotate(45deg);transition:transform .3s;flex:0 0 auto}
.faq details[open] summary::after{transform:rotate(-135deg)}
.faq .resp{padding:0 20px 20px;color:var(--mute);font-size:.95rem}

/* horário */
.hor{max-width:560px;margin:0 auto;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--line);overflow:hidden}
.hor div{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 20px;border-bottom:1px solid var(--line)}
.hor div:last-child{border-bottom:0}
.hor div:nth-child(odd){background:${dark?'rgba(255,255,255,.02)':'rgba(0,0,0,.015)'}}
.hor b{font-weight:700}
.hor span{color:var(--mute);font-variant-numeric:tabular-nums;font-weight:600}
.hor .ab{color:var(--p);font-weight:800}

/* contato */
.cts{display:grid;grid-template-columns:1fr;gap:16px;margin-bottom:36px}
.ct{background:var(--card);padding:24px 20px;border-radius:var(--r);border:1px solid var(--line);text-align:center;box-shadow:var(--sh)}
.ct .ico{margin:0 auto 12px}
.ct strong{display:block;font-size:.74rem;letter-spacing:1.3px;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.ct a,.ct p{font-weight:700;font-size:1rem;word-break:break-word}
.ct a:hover{color:var(--p)}
.cta{background:linear-gradient(135deg,var(--d),var(--p));color:#fff;text-align:center;border-radius:var(--r);padding:44px 24px;position:relative;overflow:hidden}
.cta h2{font-size:clamp(1.4rem,4vw,2rem);margin-bottom:12px}
.cta p{opacity:.94;margin-bottom:26px;font-size:1rem;max-width:540px;margin-left:auto;margin-right:auto}
.mapa{width:100%;height:320px;border:0;border-radius:var(--r);box-shadow:var(--sh);margin-top:32px}

/* rodapé */
footer{background:${dark?'#06090d':pal.d};color:#fff;padding:48px 0 24px;text-align:center;font-size:.95rem}
footer .logo{justify-content:center;margin-bottom:12px;color:#fff}
footer .fp{opacity:.72;margin-bottom:6px}
.soc{display:flex;gap:12px;justify-content:center;margin:22px 0}
.soc a{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:1.15rem;transition:background .22s,transform .22s}
.soc a:hover{background:var(--a);transform:translateY(-3px)}
.copy{border-top:1px solid rgba(255,255,255,.13);margin-top:24px;padding-top:20px;opacity:.55;font-size:.82rem;line-height:1.8}

/* flutuantes */
.float{position:fixed;right:16px;bottom:16px;width:58px;height:58px;border-radius:50%;background:#25D366;color:#fff;display:grid;place-items:center;font-size:1.7rem;box-shadow:0 8px 28px rgba(37,211,102,.48);z-index:95;transition:transform .22s}
.float:hover{transform:scale(1.1)}
.float::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid #25D366;animation:onda 2.4s infinite;pointer-events:none}
@keyframes onda{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.5);opacity:0}}
.topo-btn{position:fixed;right:18px;bottom:86px;width:46px;height:46px;border-radius:50%;background:var(--card);color:var(--p);border:1px solid var(--line);display:grid;place-items:center;font-size:1.15rem;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:94;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .3s,transform .22s}
.topo-btn.on{opacity:1;pointer-events:auto}

${c.lgpd ? `.lgpd{position:fixed;left:14px;right:14px;bottom:14px;max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 20px;box-shadow:0 14px 40px rgba(0,0,0,.28);z-index:98;display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:.87rem}
.lgpd p{flex:1;min-width:200px;color:var(--mute)}
.lgpd button{background:var(--p);color:#fff;border:0;padding:12px 20px;border-radius:calc(var(--r) - 2px);font:inherit;font-weight:700;cursor:pointer;min-height:44px}` : ''}

/* ── desktop ── */
@media(min-width:760px){
 .burger{display:none}
 .menu{display:flex;align-items:center;gap:22px;list-style:none;font-size:.92rem}
 .menu a{color:var(--mute);font-weight:600;padding:6px 0;border:0;position:relative}

 .menu a:hover{color:var(--p)}
 .menu a:hover::after{width:100%}
 .menu a.navcta{background:var(--p);color:#fff;padding:11px 20px;border-radius:var(--r);font-weight:700}

 .btn{width:auto}
 .hero.foto{padding:96px 0 84px}
 .hero.split{padding:60px 0}
 .hero.split .wrap{grid-template-columns:1.05fr .95fr;gap:48px}
 .hero.faixa{padding:56px 0}
 section{padding:72px 0}
 .sobre{grid-template-columns:${c.sobreImagem || (fotos.length > 1) ? '1.05fr .95fr' : '1fr'};gap:48px}
 .grid{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
 .passos{grid-template-columns:repeat(3,1fr)}
 .quartos{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
 .planos{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
 .areas{grid-template-columns:1fr 1fr}
 .cts{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
 .gal{grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
 .agenda{grid-template-columns:1fr 1fr;gap:34px}
 .dep-grid{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;display:grid}
 .item{padding:16px 6px}
 .hero.faixa.esq .wrap{max-width:1080px}
}
@media print{
 header,.float,.topo-btn,.lgpd,.mapa,.burger,.promo{display:none!important}
 body{background:#fff;color:#000}
 .hero{background:#fff!important;color:#000!important;padding:30px 0}
 section{padding:20px 0;break-inside:avoid}
 a{text-decoration:underline}
}

  const anos = num(r.fundacao);
  if (anos && anos.length <= 2) cfg.anosAtendimento = anos;          // "12" = anos direto
  else if (anos && anos.length === 4) {
    const y = Math.min(Math.max(parseInt(anos, 10), 1950), new Date().getFullYear());
    const dif = new Date().getFullYear() - y;
    if (dif >= 0) cfg.anosAtendimento = String(dif);
  }

  cfg.notaMedia = lim(String(r.nota_google || '').replace(/estrelas?/i, '').trim(), 5);
  cfg.qtdAvaliacoes = num(r.qtd_avaliacoes).slice(0, 8);
  if (cfg.notaMedia) cfg.linkAvaliacoes = 'https://www.google.com/search?q=' + encodeURIComponent(cfg.nome + ' ' + (cfg.bairro || ''));

  /* serviços */
  const servs = (Array.isArray(r.lista_servicos) ? r.lista_servicos : [])
    .filter(s => s && lim(s.titulo, 60))
    .map(s => ({ titulo: lim(s.titulo, 60), descricao: lim(s.descricao, 200),
                 preco: r.mostrar_precos === 'nao' ? '' : lim(s.preco, 40) }));
  if (servs.length) cfg.servicos = servs.slice(0, 6);
  if (r.mostrar_precos === 'nao') cfg.mostrarPrecos = false;

  /* depoimentos — SÓ reais */
  const deps = (Array.isArray(r.lista_depoimentos) ? r.lista_depoimentos : [])
    .filter(x => x && lim(x.texto, 400))
    .map(x => ({ texto: lim(x.texto, 400), autor: lim(x.autor, 50) || 'Cliente', papel: 'Cliente' }));
  if (deps.length) cfg.depoimentos = deps.slice(0, 3);

  /* marketing / extras */
  cfg.promoTexto = lim(r.promocao, 90);
  cfg.instagram = lim(r.instagram, 90);
  cfg.facebook = lim(r.facebook, 90);
  cfg.cnpj = lim(r.cnpj, 22);
  cfg.convenios = String(r.convenios || '').split(/[,;]/).map(s => lim(s, 40)).filter(Boolean).slice(0, 10);

  /* fotos: data URIs viram URLs no servidor; banco fica como veio */
  const fotos = (Array.isArray(r.fotos) ? r.fotos : [])
    .map(f => typeof f === 'string' ? { data: f } : f)
    .filter(f => f && (f.data || f.url || f.banco))
    .slice(0, 5);
  if (fotos.length) cfg.fotos = fotos;

  /* horários */
  const hs = [];
  if (lim(r.h_semana, 40)) hs.push({ dia: 'Segunda a Sexta', hora: lim(r.h_semana, 40) });
  const fds = lim(r.h_fds, 60);
  if (fds) {
    const sab = fds.match(/s[aá]b[^:]*[:h]?\s*([\d:hs\s–-]*?)(?:\s*[,.;]|\s*dom|\s*$)/i);
    if (sab && lim(sab[1], 30)) hs.push({ dia: 'Sábado', hora: lim(sab[1], 30) });
    const dom = fds.match(/dom[^:]*[:h]?\s*([\d:hs\s–-]*?)\s*$/i);
    if (dom && lim(dom[1], 30)) hs.push({ dia: 'Domingo', hora: lim(dom[1], 30) });
  }
  if (hs.length) cfg.horarios = hs;

  /* contato */
  cfg.whatsapp = lim(r.whatsapp, 25);
  cfg.telefone = lim(r.telefone, 25);
  cfg.email = lim(r.email, 90);
  cfg.textoCta = lim(r.cta, 30);
  cfg.mapa = !!cfg.endereco;
  cfg.botaoFlutuante = !!cfg.whatsapp;

  /* mensagens por seção (botão de WhatsApp contextual) */
  cfg.msgs = {
    geral: 'Olá! Vim pelo site da ' + cfg.nome + ' e gostaria de mais informações.',
    hero: 'Olá! Vim pelo site da ' + cfg.nome + ' e gostaria de mais informações.',
    servicos: 'Olá! Quero saber mais sobre os serviços da ' + cfg.nome + '.',
    contato: 'Olá! Tenho uma dúvida sobre a ' + cfg.nome + '.',
  };

  cfg.descricao = lim(r.slogan || cfg.slogan, 158);
  cfg.palavras = [lim(P.PERFIS[chave] && P.PERFIS[chave].rotulo, 40), lim(cfg.bairro, 40), lim(cfg.nome, 40)]
    .filter(Boolean).join(', ').toLowerCase();
  cfg.animacoes = true;
  cfg.lgpd = true;
  cfg.creditos = true;
  cfg.secoes = { sobre: true, servicos: true, galeria: false, equipe: false,
    depoimentos: true, faq: false, horario: true, contato: true, numeros: false };
  return cfg;
}

/* resumo legível das respostas, para aparecer na ficha do CRM */
function resumo(r) {
  const it = [];
  const add = (k, v) => { if (v && String(v).trim()) it.push([k, Array.isArray(v) ? v.join(', ') : String(v)]); };
  add('Quer fechar?', { sim:'SIM — quer fechar', talvez:'Quer ver antes', duvida:'Tem dúvidas' }[r.fechar] || r.fechar);
  add('Empresa', r.nome);
  add('WhatsApp', r.whatsapp);
  add('Endereço', r.endereco);
  add('Slogan', r.slogan);
  add('Instagram', r.instagram); add('Facebook', r.facebook);
  add('Promoção', r.promocao); add('Nota Google', r.nota_google);
  add('Desde', r.fundacao); add('CNPJ', r.cnpj);
  add('Convênios', r.convenios);
  add('Fotos', (r.fotos || []).length ? (r.fotos || []).length + ' foto(s)' : '');
  return it;
}

return { ETAPAS, EXTRAS, TOTAL_PERGUNTAS, CORES, briefParaConfig, resumo };
});

</script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LEAD = 'demo';
const ETAPAS = Brief.ETAPAS;

/* ── estado ── */
const R = {};
R.lista_servicos = [{titulo:'',preco:''},{titulo:'',preco:''},{titulo:'',preco:''}];

let etapa = 0;

/* ── emojis por segmento ── */
const EMOJI = { padaria:'🥖', restaurante:'🍽️', lanchonete:'🍔', bar_cafe:'☕', mercado:'🛒',
  salao:'💇', academia:'🏋️', oficina:'🔧', autopecas:'⚙️', clinica:'🩺', farmacia:'💊',
  petshop:'🐾', veterinaria:'🐶', roupas:'👗', construcao:'🧱', moveis:'🛋️', eletronicos:'📱', hotel:'🛏️',
  escola:'🎓', advocacia:'⚖️', imobiliaria:'🏠', papelaria:'✏️', floricultura:'💐',
  lavanderia:'🧺', otica:'👓', outros:'🏪' };
const CORES_NOME = { verde:'Verde', azul:'Azul', vermelho:'Vermelho', laranja:'Laranja',
  amarelo:'Amarelo', roxo:'Roxo', cinza:'Cinza', oliva:'Oliva' };

/* pré-preenche com o que já sabemos do lead */
if (LEAD) fetch('/api/lead-publico/' + encodeURIComponent(LEAD)).then(r => r.json()).then(l => {
  R.nome = l.nome || ''; R.whatsapp = l.telefone || '';
  R.endereco = [l.bairro ? '' : '', l.bairro, l.cidade].filter(Boolean).join(' - ');
  if (l.segmento) { R.segmento = l.segmento; semearServicos(l.segmento); }
  $('#tTitulo').textContent = 'Briefing — ' + l.nome;
}).catch(()=>{});

function semearServicos(seg) {
  const p = Perfis.PERFIS[seg];
  if (!p) return;
  R.lista_servicos = (p.servicos || []).slice(0, 3).map(s => ({ titulo: s.titulo, preco: s.preco || '' }));
}

/* ── compressão de imagem no próprio celular ── */
async function comprimir(file, maxLado = 1200, q = 0.72) {
  const dataUrl = await new Promise((ok, err) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = err; r.readAsDataURL(file); });
  const img = await new Promise((ok, err) => { const i = new Image(); i.onload = () => ok(i); i.onerror = err; i.src = dataUrl; });
  const f = Math.min(1, maxLado / Math.max(img.width, img.height));
  const w = Math.round(img.width * f), h = Math.round(img.height * f);
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  cv.getContext('2d').drawImage(img, 0, 0, w, h);
  return cv.toDataURL('image/jpeg', q);
}

/* ── render ── */
function desenhar() {
  const E = ETAPAS[etapa];
  const ultima = etapa === ETAPAS.length - 1;
  $('#tSub').textContent = ultima ? 'Revise e publique' : E.desc;
  $('#legEtapa').textContent = ultima ? 'Tudo pronto!' : `Etapa ${etapa + 1} de ${ETAPAS.length - 1}`;
  $('#preenche').style.width = Math.round((etapa / (ETAPAS.length - 1)) * 100) + '%';
  $('#legPct').textContent = Math.round((etapa / (ETAPAS.length - 1)) * 100) + '%';

  let html = `<div class="cartao"><h1>${E.icone} ${E.titulo}</h1><div class="desc">${E.desc}</div>`;

  if (E.id === 'inicio') {
    html += radio('fechar', E.perguntas[0]);
    html += texto('nome', E.perguntas[1]);
    html += texto('whatsapp', E.perguntas[2]);
  } else if (E.id === 'negocio') {
    html += segmento();
    html += texto('endereco', E.perguntas[1]);
    html += texto('h_semana', E.perguntas[2]);
    html += texto('h_fds', E.perguntas[3]);
  } else if (E.id === 'servicos') {
    html += servicos();
    html += cores();
  } else if (E.id === 'fotos') {
    html += fotos();
    html += texto('slogan', E.perguntas[1]);
  } else if (E.id === 'final') {
    html += final();
  }
  html += `</div>`;

  if (!ultima) {
    html += `<div class="botoes" style="margin-top:16px">
      ${etapa > 0 ? `<button class="bt sec" id="voltar">← Voltar</button>` : ''}
      <button class="bt pri" id="seguir">${etapa === ETAPAS.length - 2 ? 'Ver como ficou →' : 'Continuar →'}</button>
    </div>`;
  } else {
    html += extrasOpcionais();
  }
  $('#palco').innerHTML = html;
  ligar(ultima);
}

function texto(id, q) {
  return `<div class="q"><label>${esc(q.label)}${q.obrig ? ' *' : ''}</label>
    ${q.ajuda ? `<div class="ajuda">${esc(q.ajuda)}</div>` : ''}
    <input id="f_${id}" placeholder="${esc(q.ph || '')}" value="${esc(R[id] || '')}">
  </div>`;
}
function radio(id, q) {
  return `<div class="q"><label>${esc(q.label)}${q.obrig ? ' *' : ''}</label>
    ${q.ajuda ? `<div class="ajuda">${esc(q.ajuda)}</div>` : ''}
    <div class="opcoes">${q.opcoes.map(o => `<label class="opcao ${R[id] === o.v ? 'on' : ''}" data-r="${id}" data-v="${esc(o.v)}">
      <input type="radio" name="${id}" value="${esc(o.v)}" ${R[id] === o.v ? 'checked' : ''}>
      <span><b>${esc(o.t)}</b><small>${esc(o.d || '')}</small></span></label>`).join('')}</div></div>`;
}
function segmento() {
  return `<div class="q"><label>Qual o seu ramo? *</label>
    <div class="ajuda">A gente já monta serviços, textos e fotos do seu ramo — é só ajustar.</div>
    <div class="seg-grid">${Object.keys(Perfis.PERFIS).map(k => `<div class="seg ${R.segmento === k ? 'on' : ''}" data-seg="${k}">
      <em>${EMOJI[k] || '🏪'}</em>${esc(Perfis.PERFIS[k].rotulo || k)}</div>`).join('')}</div></div>`;
}
function servicos() {
  return `<div class="q"><label>Seus 3 principais serviços ou produtos *</label>
    <div class="ajuda">Já sugerimos do seu ramo — é só ajustar nome e preço.</div>
    <div class="lista">${R.lista_servicos.map((s, i) => `<div class="item">
      <div class="lin"><input class="sv-t" data-i="${i}" placeholder="Serviço ${i + 1}" value="${esc(s.titulo || '')}">
      <input class="sv-p preco" data-i="${i}" placeholder="Preço" value="${esc(s.preco || '')}"></div>
    </div>`).join('')}</div></div>`;
}
function cores() {
  return `<div class="q"><label>Qual cor combina com a sua marca? *</label>
    <div class="cor-grid">${Object.keys(CORES_NOME).map(k => `<div class="cor ${R.cor === k ? 'on' : ''}" data-cor="${k}"
      title="${CORES_NOME[k]}" style="background:linear-gradient(135deg,${SiteGen.PALETAS[Brief.CORES[k]].p},${SiteGen.PALETAS[Brief.CORES[k]].a})"></div>`).join('')}</div></div>`;
}
function fotos() {
  const fotosHtml = R.fotos.map((f, i) => `<div class="foto ${i === 0 ? 'on' : ''}">
    ${i === 0 ? '<span class="capa">CAPA</span>' : ''}
    <img src="${f.data || f.url}" alt="Foto ${i + 1}">
    <button data-rm="${i}" title="Remover">×</button></div>`).join('');
  const banco = bancoDoRamo();
  return `<div class="q"><label>Fotos da sua loja (a primeira vira a capa) *</label>
    <div class="ajuda">Fotografe o balcão, a fachada, os produtos. Site com foto real vende muito mais.</div>
    <div class="fotos-grid" id="fg">${fotosHtml}
      <label class="up"><input type="file" id="upFotos" accept="image/*" multiple hidden>
        <b>📷 Enviar fotos</b>toque para escolher da galeria</label>
    </div>
    ${banco ? `<div class="banco-note" style="margin-top:10px">Sem foto agora? Use as nossas (ilustrativas, trocamos depois pelas suas):</div>
    <div class="fotos-grid" style="margin-top:8px">
      ${banco.map(b => `<div class="foto banco ${R.fotos.some(f => f.url === b.url) ? 'on' : ''}" data-banco="${esc(b.url)}">
        <img src="${esc(b.url)}" alt="${esc(b.nome)}"><span class="capa">BANCO</span></div>`).join('')}
    </div>` : ''}</div>`;
}
function bancoDoRamo() {
  const mapa = { padaria:'padaria', restaurante:'restaurante', lanchonete:'restaurante', cafe_bar:'restaurante',
    oficina:'oficina', autopecas:'oficina', salao_beleza:'salao', clinica:'clinica', farmacia:'mercado',
    hotel:'hotel', academia:'academia', petshop:'petshop', mercado:'mercado', floricultura:'floricultura' };
  const k = mapa[R.segmento];
  if (!k) return [];
  return [{ url: '/fotos/banco/' + k + '.jpg', nome: k }];
}

function configAgora() {
  return Brief.briefParaConfig(R, Perfis);
}
function final() {
  const cfg = configAgora();
  const html = SiteGen.gerar(cfg);
  return `<div class="final">
    <div class="preview">
      <div class="molde"><div class="cbeco"><s></s><s></s><s></s><em>Seu site — prévia ao vivo</em></div>
      <iframe id="pv" srcdoc="${esc(html)}" title="Prévia do site"></iframe></div>
    </div>
    <div class="ajustes">
      <div class="aj"><b>✏️ Trocar slogan</b>
        <input id="ajSlogan" placeholder="${esc(cfg.slogan || 'Frase de efeito')}" value="${esc(R.slogan || '')}">
      </div>
      <div class="aj"><b>🎨 Outra cor</b>
        <div class="mini">${Object.keys(CORES_NOME).map(k => `<div class="chip cor ${R.cor === k ? 'on' : ''}" data-cor="${k}">${CORES_NOME[k]}</div>`).join('')}</div>
      </div>
      <div class="aj"><b>👁️ Preços</b>
        <div class="tog ${R.mostrar_precos === 'sim' ? 'on' : ''}" id="togPrecos"><span>Mostrar preços no site</span><div class="sw"></div></div>
      </div>
      <div class="aj"><b>📷 Foto da capa</b>
        <div class="mini">
          ${R.fotos.length ? R.fotos.map((f, i) => `<div class="chip capa ${i === 0 ? 'on' : ''}" data-capa="${i}">Foto ${i + 1}</div>`).join('') : '<span class="banco-note">Envie fotos na etapa anterior</span>'}
        </div>
      </div>
      <div class="aj"><b>📣 Promoção</b>
        <div class="tog ${R.promocao ? 'on' : ''}" id="togPromo"><span>Faixa de promoção no topo</span><div class="sw"></div></div>
        <input id="ajPromo" placeholder="Ex.: 10% OFF na primeira compra" value="${esc(R.promocao || '')}" style="margin-top:10px;${R.promocao ? '' : 'display:none'}">
      </div>
      <div class="botoes" style="margin-top:6px">
        <button class="bt pri" id="publicar" style="min-height:54px">🚀 Publicar meu site</button>
      </div>
    </div>
  </div>`;
}
function extrasOpcionais() {
  return `<div class="extras">
    <details><summary>⭐ Quero deixar o site ainda melhor (opcional)</summary><div class="corpo" id="extrasCorpo"></div></details>
    <div class="aviso" style="margin-top:12px">🔒 Nada é inventado no site: sem depoimento seu, mostramos só a nota real do Google (se você tiver).</div>
  </div>`;
}

function montarExtras() {
  const corpo = $('#extrasCorpo');
  if (!corpo) return;
  const lista = Brief.EXTRAS.filter(e => !(e.id === 'clinica' && !['clinica', 'farmacia'].includes(R.segmento)));
  corpo.innerHTML = lista.map(e => {
    let qs = '';
    for (const q of e.perguntas) {
      if (q.tipo === 'lista') {
        qs += `<div class="q"><label>${esc(q.label)}</label><div class="ajuda">${esc(q.ajuda || '')}</div>
          <div class="lista" data-lista="${q.id}">${(R[q.id] || [{ texto: '', autor: '' }]).map((x, i) => `<div class="item">
            <input class="x-t" data-i="${i}" placeholder="${esc(q.campos[0].p)}" value="${esc(x[q.campos[0].k] || '')}">
            <input class="x-a" data-i="${i}" placeholder="${esc(q.campos[1].p)}" value="${esc(x[q.campos[1].k] || '')}">
          </div>`).join('')}</div></div>`;
      } else {
        qs += `<div class="q"><label>${esc(q.label)}</label><input id="x_${q.id}" placeholder="${esc(q.ph || '')}" value="${esc(R[q.id] || '')}"></div>`;
      }
    }
    return `<div style="border-left:3px solid var(--p);padding-left:14px"><b>${e.icone} ${esc(e.titulo)}</b><div style="color:var(--mute);font-size:.85rem;margin-bottom:12px">${esc(e.desc)}</div>${qs}</div>`;
  }).join('');
  /* liga inputs dos extras */
  corpo.querySelectorAll('[data-lista]').forEach(d => {
    const id = d.dataset.lista;
    d.querySelectorAll('.x-t').forEach(inp => inp.oninput = () => { const i = +inp.dataset.i; R[id] = R[id] || [{ texto:'', autor:'' }]; R[id][i] = { texto: inp.value, autor: d.querySelectorAll('.x-a')[i].value }; });
    d.querySelectorAll('.x-a').forEach(inp => inp.oninput = () => { const i = +inp.dataset.i; R[id] = R[id] || [{ texto:'', autor:'' }]; R[id][i] = { texto: d.querySelectorAll('.x-t')[i].value, autor: inp.value }; });
  });
  corpo.querySelectorAll('input[id^=x_]').forEach(inp => inp.oninput = () => { R[inp.id.slice(2)] = inp.value; });
}

/* ── eventos ── */
function ligar(ultima) {
  /* texto */
  $$('input[id^=f_]').forEach(inp => {
    inp.oninput = () => { R[inp.id.slice(2)] = inp.value;
      if (inp.id === 'f_segmento') semearServicos(inp.value); };
  });
  /* radio (opcao inteira clicável) */
  $$('[data-r]').forEach(op => op.onclick = () => { R[op.dataset.r] = op.dataset.v; desenhar(); });
  /* segmento */
  $$('.seg').forEach(s => s.onclick = () => {
    R.segmento = s.dataset.seg;
    if (!R._tocouServicos) semearServicos(R.segmento);
    desenhar();
  });
  /* serviços */
  $$('.sv-t').forEach(inp => inp.oninput = () => { R._tocouServicos = true; R.lista_servicos[+inp.dataset.i].titulo = inp.value; });
  $$('.sv-p').forEach(inp => inp.oninput = () => { R.lista_servicos[+inp.dataset.i].preco = inp.value; });
  /* cor */
  $$('[data-cor]').forEach(c => c.onclick = () => { R.cor = c.dataset.cor; desenhar(); });
  /* fotos: upload */
  const up = $('#upFotos');
  if (up) up.onchange = async () => {
    if (!R.segmento) { alert('Escolha o ramo primeiro (etapa anterior).'); return; }
    const arqs = [...up.files];
    for (const a of arqs) {
      if (R.fotos.length >= 5) break;
      try { R.fotos.push({ data: await comprimir(a) }); } catch (e) {}
    }
    desenhar();
  };
  /* fotos: remover */
  $$('[data-rm]').forEach(b => b.onclick = () => { R.fotos.splice(+b.dataset.rm, 1); desenhar(); });
  /* fotos: banco */
  $$('[data-banco]').forEach(b => b.onclick = () => {
    const url = b.dataset.banco;
    const i = R.fotos.findIndex(f => f.url === url);
    if (i >= 0) R.fotos.splice(i, 1); else { R.fotos = R.fotos.filter(f => !f.banco || f.url === url); R.fotos.unshift({ url, banco: true }); }
    desenhar();
  });

  const vb = $('#voltar'); if (vb) vb.onclick = () => { etapa--; desenhar(); };
  const sg = $('#seguir'); if (sg) sg.onclick = () => {
    const E = ETAPAS[etapa];
    const obrig = E.perguntas.filter(q => q.obrig).map(q => q.id);
    if (obrig.includes('fechar') && !R.fechar) return alert('Responda se quer fechar para continuar.');
    if (obrig.includes('nome') && !R.nome.trim()) return alert('Escreva o nome da empresa.');
    if (obrig.includes('whatsapp') && String(R.whatsapp).replace(/\D/g, '').length < 10) return alert('Informe um WhatsApp válido (com DDD).');
    if (obrig.includes('segmento') && !R.segmento) return alert('Escolha o ramo.');
    if (obrig.includes('endereco') && !R.endereco.trim()) return alert('Informe o endereço.');
    if (obrig.includes('h_semana') && !R.h_semana.trim()) return alert('Informe o horário de funcionamento.');
    if (obrig.includes('lista_servicos')) {
      R.lista_servicos = R.lista_servicos.filter(s => s.titulo.trim());
      if (!R.lista_servicos.length) return alert('Adicione pelo menos 1 serviço.');
    }
    if (obrig.includes('cor') && !R.cor) return alert('Escolha uma cor.');
    if (obrig.includes('fotos') && !R.fotos.length && !confirm('Sem nenhuma foto? O site fica com uma foto ilustrativa do seu ramo.\n\nToque em OK para continuar assim — você pode mandar as suas depois pelo WhatsApp.')) return;
    etapa++; desenhar();
  };

  if (ultima) {
    ligarFinal();
    montarExtras();
  }
}

function ligarFinal() {
  /* ajustes rápidos — cada mudança re-renderiza a prévia */
  const pv = $('#pv');
  const atualizar = () => { const cfg = configAgora(); pv.srcdoc = SiteGen.gerar(cfg); };

  const ajS = $('#ajSlogan');
  if (ajS) ajS.oninput = () => { R.slogan = ajS.value; atualizar(); };
  const ajP = $('#ajPromo');
  if (ajP) ajP.oninput = () => { R.promocao = ajP.value; atualizar(); };

  const togP = $('#togPrecos');
  if (togP) togP.onclick = () => {
    R.mostrar_precos = R.mostrar_precos === 'sim' ? 'nao' : 'sim';
    togP.classList.toggle('on', R.mostrar_precos === 'sim');
    atualizar();
  };
  const togPr = $('#togPromo');
  if (togPr) togPr.onclick = () => {
    R.promocao = R.promocao ? '' : (ajP.value || '10% OFF na primeira compra');
    togPr.classList.toggle('on', !!R.promocao);
    if (ajP) { ajP.style.display = R.promocao ? '' : 'none'; ajP.value = R.promocao; }
    atualizar();
  };
  $$('.capa').forEach(c => c.onclick = () => {
    const i = +c.dataset.capa;
    const f = R.fotos.splice(i, 1)[0];
    R.fotos.unshift(f);
    desenhar();
  });

  const pub = $('#publicar');
  if (pub) pub.onclick = async () => {
    pub.disabled = true; pub.textContent = 'Publicando…';
    try {
      const cfg = Brief.briefParaConfig(R, Perfis);
      const j = { html: SiteGen.gerar(cfg), url: '#', slug: '' };
      concluir(j);
    } catch (e) {
      pub.disabled = false; pub.textContent = '🚀 Publicar meu site';
      alert(e.message);
    }
  };
}

function concluir(j) {
  $('#barra').style.display = 'none';
  const dom = String(R.dominio||'').trim().replace(/^https?:\/\//,'').replace(/\/$/,'');
  const url = 'https://' + (dom || String(R.nome||'seusite').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'') + '.com.br');
  const zap = R.whatsapp ? String(R.whatsapp).replace(/\D/g, '') : '';
  $('#palco').innerHTML = `<div class="cartao fim">
    <div class="selo">✓</div>
    <h2>Pronto${esc(String(R.nome || '').split(' ')[0] ? ', ' + R.nome.split(' ')[0] : '')}! Seu site está no ar 🎉</h2>
    <p>Mande o link para alguém agora — dá para ver e aprovar pelo celular:</p>
    <div class="link">${esc(url)}</div>
    <div class="molde"><div class="cbeco"><s></s><s></s><s></s><em>${esc(url)}</em></div>
      <iframe srcdoc="${esc(j.html)}" title="Seu site"></iframe></div>
    <div class="botoes">
      <button class="bt pri" onclick="try{const w=window.open();w.document.write(decodeURIComponent(this.dataset.h));w.document.close();}catch(e){alert('Abra o arquivo baixado para ver em tela cheia.')}" data-h="${encodeURIComponent(j.html)}">↗ Abrir meu site em tela cheia</button>
      
      ${zap ? `<a class="bt" href="https://wa.me/${zap.length <= 11 ? '55' + zap : zap}?text=${encodeURIComponent('Olha o site da ' + (R.nome || 'nossa empresa') + ': ' + url)}" target="_blank" rel="noopener">💬 Mandar no WhatsApp</a>` : ''}
    </div>
    <p style="margin-top:20px;font-size:.9rem">${R.fechar === 'sim'
      ? 'Recebemos seu pedido de fechamento — o Nataniel entra em contato para os ajustes finais e a publicação no seu domínio.'
      : 'Ficou com alguma dúvida? É só chamar o Nataniel no WhatsApp que ajustamos o que precisar.'}</p>
  </div>`;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

desenhar();
</script>
</body>
</html>
